name: PR Verify

on:
  workflow_dispatch:
    inputs:
      qualification_version:
        description: Exact 2.3.1 stable or numeric RC version to verify without publication
        required: false
        type: string
      source_ref:
        description: Exact source revision to qualify (empty uses the workflow revision)
        required: false
        type: string
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: PR Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      MinVerVersionOverride: ${{ inputs.qualification_version || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - name: Validate qualification version
        run: |
          if [[ -n "$MinVerVersionOverride" ]]; then
            [[ "$MinVerVersionOverride" =~ ^2\.3\.1(-rc\.[0-9]+(\.[0-9]+)*)?$ ]]
          fi

      - name: Enable long paths for preserved private evidence on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Record qualified source revision
        run: git rev-parse HEAD

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Verify release documentation describes the qualified version
        run: |
          if [[ "$MinVerVersionOverride" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            python3 scripts/check-release-docs.py "$MinVerVersionOverride"
          fi

      - name: Initialize cold NuGet directories
        run: |
          DEPENDENCY_PACKAGES_PATH="$RUNNER_TEMP/nuget-packages-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          DEPENDENCY_HTTP_CACHE_PATH="$RUNNER_TEMP/nuget-http-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$DEPENDENCY_PACKAGES_PATH" "$DEPENDENCY_HTTP_CACHE_PATH"
          echo "NUGET_PACKAGES=$DEPENDENCY_PACKAGES_PATH" >> "$GITHUB_ENV"
          echo "NUGET_HTTP_CACHE_PATH=$DEPENDENCY_HTTP_CACHE_PATH" >> "$GITHUB_ENV"

      - name: Verify dependency bytes and identities
        run: python3 scripts/check-runner-dependencies.py

      - name: dotnet restore
        run: dotnet restore Boutquin.Trading.slnx --configfile nuget.ci.config --locked-mode --no-http-cache -p:_WorkloadLibraryPacksFolder="$RUNNER_TEMP/absent-sdk-feed"

      - name: Verify resolved dependency provenance
        run: python3 scripts/check-runner-dependencies.py --packages "$NUGET_PACKAGES"

      - name: Build with dotnet
        run: dotnet build Boutquin.Trading.slnx --configuration Release --no-restore

      - name: Verify dependency DLL identities
        run: python3 scripts/verify-dependency-identities.py --packages "$NUGET_PACKAGES" --outputs . --report coverage/dependency-identities.json

      - name: Verify packaged XML documentation
        run: |
          python3 scripts/check-package-docs.py --self-test
          dotnet pack Boutquin.Trading.slnx --configuration Release --no-build --no-restore --output ./artifacts/doc-packages
          python3 scripts/check-package-docs.py ./artifacts/doc-packages

      - name: dotnet test with coverage
        run: dotnet test Boutquin.Trading.slnx --configuration Release --no-build --collect:"XPlat Code Coverage" --logger trx --blame-hang-timeout 5m --results-directory ./coverage

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report-${{ matrix.os }}
          path: coverage/
        if: always()

      - name: dotnet format (whitespace)
        run: dotnet format whitespace Boutquin.Trading.slnx --verify-no-changes --no-restore

      - name: dotnet format (style)
        run: dotnet format style Boutquin.Trading.slnx --verify-no-changes --no-restore --exclude-diagnostics IDE1006 IDE0060

      - name: dotnet format (analyzers)
        run: dotnet format analyzers Boutquin.Trading.slnx --verify-no-changes --no-restore --exclude-diagnostics CA1305 CA2007 CA2208 xUnit1030

      - name: Vulnerable dependency scan
        run: |
          dotnet list Boutquin.Trading.slnx package --vulnerable --include-transitive --format json > dependency-vulnerabilities.json
          python3 scripts/check-vulnerabilities.py dependency-vulnerabilities.json


      - name: Verify RC archive checks
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Verify explicit solution commands
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 scripts/check-verification-workflow.py --self-test
          python3 scripts/check-verification-workflow.py .github/workflows/pr-verify.yml

      - name: Doc quality — prohibited phrase scan
        run: |
          MATCHES=$(grep -rn \
            -e 'Provides the .* functionality' \
            -e 'Executes the .* operation' \
            -e 'Gets or sets the .* for this instance' \
            --include='*.cs' src/ || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Prohibited documentation phrases found:"
            echo "$MATCHES"
            exit 1
          fi

      - name: Doc quality — low-signal phrase scan
        run: |
          MATCHES=$(grep -rn \
            -e 'Input value for <paramref name=' \
            -e '/// Executes ' \
            -e 'Operation result\.' \
            --include='*.cs' src/ || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Low-signal documentation phrases found:"
            echo "$MATCHES"
            exit 1
          fi

      - name: Doc quality — accessor-verb scan
        run: |
          MATCHES=$(grep -rn '/// Gets \w' --include='*.cs' src/ || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Accessor-verb property summaries found (use semantic descriptions instead):"
            echo "$MATCHES"
            exit 1
          fi
